version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: trade-analyze-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: trade-analyze
    networks:
      - trade-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trade-analyze-backend
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/trade-analyze
      PYTHON_API_URL: http://ai-engine:8000
      PORT: 5000
    networks:
      - trade-network
    command: npm run start

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trade-analyze-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - trade-network

  ai-engine:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    container_name: trade-analyze-ai
    ports:
      - "8000:8000"
    networks:
      - trade-network
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000

volumes:
  mongodb_data:

networks:
  trade-network:
    driver: bridge
